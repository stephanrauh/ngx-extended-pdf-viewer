<dialog id="passwordDialog">
  <div class="row">
    <label for="password" id="passwordText" data-l10n-id="pdfjs-password-label">Enter the password to open this PDF file:</label>
  </div>
  <div class="row">
    <input type="text" id="password" class="toolbarField" />
  </div>
  <div class="buttonRow">
    <!-- pdf.js 6.3 renamed .dialogButton to .secondaryButton / .primaryButton; both classes are
         emitted so the same template styles correctly against the 6.2 (assets) and 6.3
         (bleeding-edge) bundles. -->
    <button id="passwordCancel" class="dialogButton secondaryButton"><span data-l10n-id="pdfjs-password-cancel-button">Cancel</span></button>
    <button id="passwordSubmit" class="dialogButton primaryButton"><span data-l10n-id="pdfjs-password-ok-button">OK</span></button>
  </div>
</dialog>
