version: 2
updates:
  # The dev shell / demo workspace. Nothing here ships: the published package
  # (projects/ngx-extended-pdf-viewer) declares zero dependencies and only two
  # peer dependencies, so these updates are about local build tooling only.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/*"
          - "ng-packagr"
      build-tooling:
        dependency-type: development
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/*"
          - "ng-packagr"
      runtime:
        dependency-type: production
        exclude-patterns:
          - "@angular/*"
    ignore:
      # The dev shell deliberately stays on Angular 19 — it is the lowest
      # version the library supports, so building against it proves the
      # >=19 peer range. Patch and minor updates are wanted; majors are not.
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@angular-devkit/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@schematics/*"
        update-types: [version-update:semver-major]
      - dependency-name: "ng-packagr"
        update-types: [version-update:semver-major]
      # TypeScript is pinned to the range Angular 19 supports.
      - dependency-name: "typescript"
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Pinned to the Jest 29 line. 14.6.2 is the last jest-preset-angular
      # release on jest ^29; every version from 15 up requires jest ^30, and
      # 17 additionally requires Angular 20 and TypeScript 5.8. Moving off 29
      # means migrating jest + ts-jest + jest-environment-jsdom together, so
      # it is a deliberate piece of work, not a dependabot merge.
      - dependency-name: "jest"
        update-types: [version-update:semver-major]
      - dependency-name: "jest-preset-angular"
        update-types: [version-update:semver-major]
      - dependency-name: "jest-environment-jsdom"
        update-types: [version-update:semver-major]
      - dependency-name: "ts-jest"
        update-types: [version-update:semver-major]
      # @types/node majors track TypeScript minimums: 26.x already requires
      # exactly our TS 5.6, so the next major would break the TS pin above.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Private, unpublished schematic used to scaffold showcase documentation
  # pages (npm run add-documentation-page). It has its own lockfile, which is
  # why its transitive alerts never showed up in the root update PRs.
  - package-ecosystem: npm
    directory: "/projects/showcase-schematics"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    groups:
      showcase-schematics:
        patterns:
          - "*"
    ignore:
      - dependency-name: "@angular-devkit/*"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major, version-update:semver-minor]

  # Keeps the CI workflows (jest.yml, publish.yml) on current action versions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
